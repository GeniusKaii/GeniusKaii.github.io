<text x="30" y="34" font-size="17" font-weight="700" fill="#c9a7ff">贝叶斯推断：每答一题，范围就窄一点</text>
<text x="30" y="58" font-size="13" fill="#a89cba">横轴是 15–55 岁的每一个年龄，柱子的高度是它成为答案的可能性</text>
<text x="30" y="80" font-size="12.5" fill="#3ddc97">这个例子的真实年龄是 32 岁，绿色柱就是最后猜中的位置</text>
<text x="30" y="102" font-size="11.5" fill="#7a6f8d">一开始所有年龄都可能，每题削掉一批，最后收敛到一小段。</text>
