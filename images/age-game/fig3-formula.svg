<text x="62" y="324" font-size="12.5" fill="#a89cba">区别在于：人一旦「赶上过」，再待更久也不会更「命中」；</text>
<text x="62" y="344" font-size="12.5" fill="#a89cba">简单平均却会一直往上加，等于把「赶上过」和「赶上很久」当成两回事。</text>
