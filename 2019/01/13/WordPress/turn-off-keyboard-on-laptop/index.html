  <div class="post-body">
    <p>我总是有这种奇奇怪怪的需求</p>
<p>用<strong>管理员权限</strong>打开<code>cmd</code>命令行</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># sc config i8042prt start=disabled</span></span><br></pre></td></tr></table></figure>

<p>然后重启就可以关掉笔记本自己的键盘了</p>
<p>如果想重新启用的话，类似</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">sc config i8042prt start=auto</span><br></pre></td></tr></table></figure>
<p>记住要重启</p>
