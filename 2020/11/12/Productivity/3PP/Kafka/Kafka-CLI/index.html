  <div class="post-body">
    <p>一些常用的 Kafka 的命令行操作。</p>
<a id="more"></a>
<h5 id="列出所有-topic"><a href="#列出所有-topic" class="headerlink" title="列出所有 topic"></a>列出所有 topic</h5><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">$ kafka-topics.sh --zookeeper &lt;zkAddress&gt;:&lt;zkPort&gt;/&lt;zkPath&gt; </span><br><span class="line">--list</span><br></pre></td></tr></table></figure>
<h5 id="创建-topic"><a href="#创建-topic" class="headerlink" title="创建 topic"></a>创建 topic</h5><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">$ kafka-topics.sh --zookeeper &lt;zkAddress&gt;:&lt;zkPort&gt;/&lt;zkPath&gt; </span><br><span class="line">--create --topic &lt;topic_name&gt;</span><br><span class="line">--replication-factor &lt;factor_number&gt; --partitions &lt;partition_number&gt;</span><br></pre></td></tr></table></figure>
<h5 id="描述-topic"><a href="#描述-topic" class="headerlink" title="描述 topic"></a>描述 topic</h5><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">$ kafka-topics.sh --zookeeper &lt;zkAddress&gt;:&lt;zkPort&gt;/&lt;zkPath&gt; </span><br><span class="line">--describe --topic &lt;topic_name&gt;</span><br></pre></td></tr></table></figure>
<h5 id="生产消息"><a href="#生产消息" class="headerlink" title="生产消息"></a>生产消息</h5><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">$ kafka-console-producer.sh --bootstrap-server &lt;kfAddress&gt;:&lt;kfPort&gt; </span><br><span class="line">--topic &lt;topic_name&gt;</span><br></pre></td></tr></table></figure>
<h5 id="消费消息"><a href="#消费消息" class="headerlink" title="消费消息"></a>消费消息</h5><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">$ kafka-console-consumer.sh --bootstrap-server &lt;kfAddress&gt;:&lt;kfPort&gt; </span><br><span class="line">--topic &lt;topic_name&gt; --from-beginning</span><br></pre></td></tr></table></figure>
