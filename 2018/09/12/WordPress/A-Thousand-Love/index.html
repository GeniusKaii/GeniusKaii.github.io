    <p>“你知道9月12号是什么日子吗”</p>
<a id="more"></a>

<p>心头一惊，又是什么日子？</p>
<p>掰指头数了两秒，喔，1000天啊。</p>
<p>1000天而已啦，又不是要……</p>
<p>日子过得真是快。我还记得第1天，第100天，第300天，第365，第520，第600,800,999天，转眼间这就上四位数了。我还有那么多事情没来得及做，就已经快三年了。</p>
<p>也不快。我们也度过了那么多，虚岁25，接近一半的人生有你相伴，希望能，哈哈！</p>
<p>继续爱你哟~</p>
