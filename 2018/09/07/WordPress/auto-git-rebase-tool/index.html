"line"><span class="built_in">echo</span> -e <span class="string">"\033[36m#   author Kaii      #\033[0m"</span></span><br><span class="line"><span class="built_in">echo</span> -e <span class="string">"\033[36m#   version 1.2.1    #\033[0m"</span></span><br><span class="line"><span class="built_in">echo</span> -e <span class="string">"\033[36m######################\033[0m"</span></span><br><span class="line"><span class="built_in">echo</span></span><br><span class="line"><span class="built_in">echo</span> -e <span class="string">"\033[36mAUTO REBASE STARTING\033[0m"</span></span><br><span class="line"><span class="built_in">echo</span> -e <span class="variable">$SEPARATE_LINE</span></span><br><span class="line"></span><br><span class="line">current_branch=`git symbolic-ref --short -q HEAD`</span><br><span class="line">git_status=`git status | grep <span class="string">"nothing to commit"</span> | wc -l`</span><br><span class="line"><span class="comment"># git_status!=0 means nothing to add&amp;stash</span></span><br><span class="line"><span class="comment"># git_status=0 means something to add&amp;stash</span></span><br><span class="line"></span><br><span class="line"><span class="function"><span class="title">gitStash</span></span>() &#123;</span><br><span class="line">    <span class="keyword">if</span> [ <span class="variable">$git_status</span> -eq 0 ]</span><br><span class="line">    <span class="keyword">then</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mmodification detected\033[0m"</span></span><br><span class="line">        git status</span><br><span class="line">        <span class="built_in">echo</span> -e <span class="variable">$SEPARATE_LINE</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mgit add .\033[0m"</span></span><br><span class="line">        git add .</span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mgit add completed\033[0m"</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="variable">$SEPARATE_LINE</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mgit stash\033[0m"</span></span><br><span class="line">        git stash</span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mgit stash completed\033[0m"</span></span><br><span class="line">    <span class="keyword">else</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mnothing modified\033[0m"</span></span><br><span class="line">    <span class="keyword">fi</span></span><br><span class="line">    <span class="built_in">echo</span> -e <span class="variable">$SEPARATE_LINE</span></span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="function"><span class="title">gitCheckOutMaster</span></span>() &#123;</span><br><span class="line">    <span class="keyword">if</span> [ <span class="variable">$current_branch</span> != <span class="string">"master"</span> ]</span><br><span class="line">    <span class="keyword">then</span></span><br><span class="line">        <span class="comment"># if working on a checkout branch</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mgit checkout master\033[0m"</span></span><br><span class="line">        git checkout master</span><br><span class="line">        <span class="built_in">echo</span> -e <span class="string">"\033[35mcurrent branch: `git symbolic-ref --short -q HEAD`\033[0m"</span></span><br><span class="line">        <span class="built_in">echo</span> -e <span class="variable">$SEPARATE_LINE</span></span><br><span class="line">    <span class="keyword">fi</span></span><br><span class="line">&#125;</span><br></pre><
